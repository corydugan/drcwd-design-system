<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--surface); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--surface); }
  .cover svg { position: absolute; left: 0; top: 0; }
  .accent { fill: var(--surface-accent); }
  .strong { fill: var(--surface-fg-strong); }
  .tint { fill: var(--grape-100); }
  .soft { fill: var(--grape-500); }
  .hair { stroke: var(--surface-rule); stroke-width: var(--bw-hair); }
  .base { stroke: var(--surface-baseline); stroke-width: var(--bw-strong); }
  .text { position: absolute; left: 48px; bottom: 48px; max-width: 440px; }
  .name { font-family: var(--font-serif); font-weight: 400; font-size: 80px; line-height: .95; letter-spacing: var(--tracking-display); color: var(--surface-fg); margin: 0; }
  .tagline { font-family: var(--font-sans); font-size: 14px; line-height: 1.4; color: var(--surface-fg-muted); margin: 16px 0 0; }
</style></head>
<body>
  <div class="cover">
    <!--
      blocks:  surface-accent slab 128 x 288 (space-32, full height) · tint grape-100 240 x 128 (space-32 tall, bleeds top and right)
               · surface-fg-strong 160 x 96 (space-40 by space-24) · grape-500 64 x 64 (space-16)
      arrange: one tall slab with satellites, squared, right of x 480, two blocks bleeding off the top and right edges
      pattern: editorial row, "hairline rules as structure", "borders not shadows": three surface-rule hairlines crossing the blocks,
               plus one 48px data-baseline in surface-baseline, the brand's "measured" mark
      scales:  sides space-16, space-24, space-32, space-40; rule pitch space-16; radius-0 everywhere (editorial cards squared)
    -->
    <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
      <rect class="tint" x="720" y="0" width="240" height="128"/>
      <rect class="accent" x="592" y="0" width="128" height="288"/>
      <rect class="strong" x="720" y="128" width="160" height="96"/>
      <rect class="soft" x="528" y="192" width="64" height="64"/>
      <line class="hair" x1="480" y1="64.5" x2="960" y2="64.5"/>
      <line class="hair" x1="480" y1="160.5" x2="960" y2="160.5"/>
      <line class="hair" x1="480" y1="256.5" x2="960" y2="256.5"/>
      <line class="base" x1="880" y1="241" x2="928" y2="241"/>
    </svg>
    <div class="text">
      <p class="name">drCWDugan</p>
      <p class="tagline">Authority is held by data rigour, not decoration.</p>
    </div>
  </div>
</body></html>
