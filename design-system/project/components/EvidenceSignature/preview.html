<!-- @dsCard group="Motif" height=320 subtitle="Stat, method label, data baseline, evidence, citation" -->
<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8">
<style>
  body { margin: 0; padding: var(--space-8) var(--space-10); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-10); margin: 0 0 var(--space-6); }
  .block .method-label { display: block; margin-bottom: var(--space-3); }
  .block .stat { display: block; }
  .block .evidence { display: block; margin-top: var(--space-3); }
</style></head>
<body>
  <div class="stats">
    <div class="block">
      <span class="method-label">Prevalence · ferritin below 25 ug/L</span>
      <span class="stat stat--grape">38.6%</span>
      <hr class="data-baseline">
      <span class="evidence"><span class="nowrap">n = 3,490</span> · iron deficient</span>
    </div>
    <div class="block">
      <span class="method-label">Prevalence · ferritin below 50 ug/L</span>
      <span class="stat">77.5%</span>
      <hr class="data-baseline">
      <span class="evidence">the same blood, a higher cut-off</span>
    </div>
  </div>
  <p class="citation">Population: 3,490 United States females aged 12 to 21. Figures from the brand book's worked example of the voice.</p>
</body></html>
