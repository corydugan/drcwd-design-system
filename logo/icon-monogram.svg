<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Dr. Cory Dugan icon">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;display=swap');
      .mono { font-family:'DM Serif Display', Georgia, serif; font-size:48px; fill:#FFFFFF; }
    </style>
  </defs>
  <!-- grape tile, brand xl radius -->
  <rect x="0" y="0" width="96" height="96" rx="22" fill="#352051"/>
  <!-- serif monogram -->
  <text x="48" y="58" text-anchor="middle" class="mono">cd</text>
  <!-- signature baseline in paper -->
  <rect x="35" y="70" width="26" height="3" fill="#FFFFFF"/>
</svg>
