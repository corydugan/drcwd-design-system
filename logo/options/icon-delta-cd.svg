<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Dr. Cory Dugan — delta over cd monogram">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;display=swap');
      .mono { font-family:'DM Serif Display', Georgia, serif; font-size:34px; fill:#FFFFFF; }
    </style>
  </defs>
  <rect width="96" height="96" rx="22" fill="#352051"/>
  <!-- small delta accent above the serif monogram -->
  <polygon points="48,20 40,35 56,35" fill="#FFFFFF"/>
  <text x="48" y="70" text-anchor="middle" class="mono">cd</text>
</svg>
