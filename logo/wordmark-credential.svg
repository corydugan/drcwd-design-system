<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180" role="img" aria-label="Dr. Cory Dugan, PhD — Health-Screening AI">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=DM+Sans:wght@600&amp;display=swap');
      .wm  { font-family:'DM Serif Display', Georgia, serif; font-size:68px; fill:#352051; }
      .eye { font-family:'DM Sans', sans-serif; font-size:13px; font-weight:600; letter-spacing:2.3px; fill:#797A80; }
    </style>
  </defs>
  <!-- eyebrow / discipline tag -->
